name: Desktop Admin Release

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Exact backend commit/tag to compile into the desktop app
        required: false
        type: string
  push:
    tags:
      - "desktop-admin-v*"

permissions:
  contents: read

concurrency:
  group: release-desktop-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  shared-user-gate:
    name: Validate shared code and all sibling bundles
    runs-on: ubuntu-latest
    # Job-wide, not per-step: web-build.cjs reads these from the environment and
    # the runner has no .env file to fall back on, so every build step needs
    # them, not only the check step. These are gate values — the bundles built
    # here are inspected and thrown away, never shipped.
    env:
      PUBLIC_API_BASE: http://localhost:8001/api/v1
      PUBLIC_APP_NAME: Selorson
      PUBLIC_APP_VERSION: 3.0.0
      PUBLIC_WS_URL: ws://localhost:8001/ws
    steps:
      - name: Checkout frontend source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies once
        run: npm ci

      - name: Check shared Svelte and runtime code
        run: |
          npm run check
          npm run test:runtime
          npm run artifacts:test

      - name: Build desktop-user bundle
        run: npm run build:desktop:user
      - name: Build web-user bundle
        run: npm run build:web:user

      - name: Build web-admin bundle
        run: npm run build:web:admin

      - name: Build android-user bundle
        run: npm run build:mobile:user
      - name: Build android-admin bundle
        run: npm run build:mobile:admin

  windows-installer:
    needs: shared-user-gate
    name: Build signed desktop-admin updater
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "1"

    steps:
      - name: Checkout frontend source
        uses: actions/checkout@v4
        with:
          path: frontend-v3
          persist-credentials: false

      - name: Resolve pinned backend revision
        id: backend
        shell: pwsh
        env:
          INPUT_BACKEND_REF: ${{ inputs.backend_ref }}
          DEFAULT_BACKEND_REF: ${{ vars.DESKTOP_BACKEND_REF }}
        run: |
          $ref = $env:INPUT_BACKEND_REF
          if ([string]::IsNullOrWhiteSpace($ref)) {
            $ref = $env:DEFAULT_BACKEND_REF
          }
          if ($ref -notmatch '^[0-9a-fA-F]{40}$') {
            throw "backend_ref/DESKTOP_BACKEND_REF must be an immutable 40-character commit SHA."
          }
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout pinned backend source
        uses: actions/checkout@v4
        with:
          repository: selorsontales-ai/selorson-be
          ref: ${{ steps.backend.outputs.ref }}
          path: backend-v3
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-v3/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend-v3/src-tauri/target
          key: ${{ runner.os }}-desktop-admin-${{ hashFiles('frontend-v3/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-desktop-admin-
            ${{ runner.os }}-tauri-

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-v3

      - name: Install sidecar dependencies
        run: npm ci --prefix src-tauri/sidecar
        working-directory: frontend-v3

      # The pinned backend is compiled here, never tested here. Its integration
      # suite needs a PostgreSQL service and a Windows runner cannot start one,
      # so `cargo test` on that manifest fails before it reaches an assertion.
      # The backend repository's own CI gates that SHA against Postgres, and the
      # installer build below links selorson-backend as a dependency — a pinned
      # revision that does not compile still fails this job.
      - name: Test the desktop runtime
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          npm run sidecar:test
        working-directory: frontend-v3

      - name: Prepare signed updater configuration
        id: release
        if: startsWith(github.ref, 'refs/tags/desktop-admin-v')
        shell: pwsh
        working-directory: frontend-v3
        env:
          RELEASE_REPOSITORY: ${{ vars.DESKTOP_ADMIN_RELEASE_REPOSITORY }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^desktop-admin-v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Desktop tag must match desktop-admin-vX.Y.Z."
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_REPOSITORY)) {
            throw "Set repository variable DESKTOP_ADMIN_RELEASE_REPOSITORY."
          }
          if ([string]::IsNullOrWhiteSpace($env:UPDATER_PUBLIC_KEY)) {
            throw "Set repository variable TAURI_UPDATER_PUBLIC_KEY."
          }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PRIVATE_KEY)) {
            throw "Set repository secret TAURI_SIGNING_PRIVATE_KEY."
          }

          $rawVersion = $Matches.version

          $tauriConfig = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriConfig.version = $rawVersion
          $tauriConfig | ConvertTo-Json -Depth 20 | Out-File src-tauri/tauri.conf.json -Encoding utf8

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = $rawVersion
          $package | ConvertTo-Json -Depth 20 | Out-File package.json -Encoding utf8

          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version = "[^"]+"', "version = `"$rawVersion`""
          $cargo | Out-File src-tauri/Cargo.toml -Encoding utf8

          $releaseConfig = @{
            bundle = @{
              createUpdaterArtifacts = $true
            }
            plugins = @{
              updater = @{
                pubkey = $env:UPDATER_PUBLIC_KEY
                endpoints = @(
                  "https://github.com/$($env:RELEASE_REPOSITORY)/releases/latest/download/latest.json"
                )
                windows = @{
                  installMode = "passive"
                }
              }
            }
          }
          $releaseConfig | ConvertTo-Json -Depth 20 | Out-File src-tauri/updater.release.conf.json -Encoding utf8
          "version=$rawVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build local gate installer
        if: github.event_name == 'workflow_dispatch'
        run: npm run tauri -- build
        working-directory: frontend-v3
        env:
          VITE_DESKTOP_UPDATER_ENABLED: "false"
          VITE_APP_FLAVOR: desktop-admin
          SELORSON_APP_FLAVOR: desktop-admin
          PUBLIC_API_BASE: http://localhost:8001/api/v1
          PUBLIC_APP_NAME: Selorson
          PUBLIC_APP_VERSION: 3.0.0
          PUBLIC_WS_URL: ws://localhost:8001/ws

      - name: Build signed release installer
        if: startsWith(github.ref, 'refs/tags/desktop-admin-v')
        run: npm run tauri -- build --config src-tauri/updater.release.conf.json
        working-directory: frontend-v3
        env:
          VITE_DESKTOP_UPDATER_ENABLED: "true"
          VITE_APP_FLAVOR: desktop-admin
          SELORSON_APP_FLAVOR: desktop-admin
          PUBLIC_API_BASE: http://localhost:8001/api/v1
          PUBLIC_APP_NAME: Selorson
          PUBLIC_APP_VERSION: 3.0.0
          PUBLIC_WS_URL: ws://localhost:8001/ws
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Smoke-test packaged app startup
        shell: pwsh
        working-directory: frontend-v3
        run: |
          $app = Get-Item src-tauri/target/release/app.exe
          $process = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($process.HasExited) {
            throw "Packaged desktop app exited during startup smoke test."
          }
          Stop-Process -Id $process.Id -Force

      - name: Generate signed latest.json
        if: startsWith(github.ref, 'refs/tags/desktop-admin-v')
        shell: pwsh
        working-directory: frontend-v3
        env:
          RELEASE_REPOSITORY: ${{ vars.DESKTOP_ADMIN_RELEASE_REPOSITORY }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.release.outputs.version }}"
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not generated."
          }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Updater signature was not generated."
          }

          $signature = (Get-Content $signaturePath -Raw).Trim()
          $url = "https://github.com/$($env:RELEASE_REPOSITORY)/releases/download/$tag/$($installer.Name)"
          $notes = if (Test-Path RELEASE_NOTES.md) {
            Get-Content RELEASE_NOTES.md -Raw
          } else {
            "Bản cập nhật Selorson Desktop Admin $version."
          }

          $manifest = @{
            version = $version
            notes = $notes.Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $url
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Out-File latest.json -Encoding utf8

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: selorson-desktop-admin-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            frontend-v3/src-tauri/target/release/bundle/msi/*.msi
            frontend-v3/src-tauri/target/release/bundle/nsis/*-setup.exe
            frontend-v3/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            frontend-v3/latest.json
            frontend-v3/RELEASE_NOTES.md

  publish:
    name: Publish signed desktop-admin artifact
    if: startsWith(github.ref, 'refs/tags/desktop-admin-v')
    needs: windows-installer
    runs-on: windows-latest
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: selorson-desktop-admin-${{ github.ref_name }}
          path: installers

      - name: Publish from a clean runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          RELEASE_REPOSITORY: ${{ vars.DESKTOP_ADMIN_RELEASE_REPOSITORY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "Set repository secret DESKTOP_RELEASE_TOKEN."
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_REPOSITORY)) {
            throw "Set repository variable DESKTOP_ADMIN_RELEASE_REPOSITORY."
          }

          $installer = Get-ChildItem installers -Recurse -Filter *-setup.exe | Select-Object -First 1
          $manifest = Get-ChildItem installers -Recurse -Filter latest.json | Select-Object -First 1
          if ($null -eq $installer -or $null -eq $manifest) {
            throw "Signed installer or latest.json is missing."
          }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Updater signature is missing."
          }
          $signature = Get-Item $signaturePath
          $notes = Get-ChildItem installers -Recurse -Filter RELEASE_NOTES.md | Select-Object -First 1

          $version = "${{ github.ref_name }}" -replace '^desktop-admin-v', ''
          $arguments = @(
            "release", "create", "${{ github.ref_name }}",
            "--repo", $env:RELEASE_REPOSITORY,
            "--title", "Selorson Desktop Admin $version"
          )
          if ($null -ne $notes) {
            $arguments += @("--notes-file", $notes.FullName)
          } else {
            $arguments += @("--notes", "Automatic update for Selorson Desktop Admin.")
          }
          $arguments += @($installer.FullName, $signature.FullName, $manifest.FullName)
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE."
          }
