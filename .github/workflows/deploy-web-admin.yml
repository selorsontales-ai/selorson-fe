name: Deploy Web Admin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-admin
  cancel-in-progress: false

jobs:
  build:
    name: Build isolated web-admin artifact
    runs-on: ubuntu-latest
    env:
      ADMIN_PROJECT_NAME: ${{ vars.CLOUDFLARE_ADMIN_PROJECT_NAME }}
      PUBLIC_API_BASE: https://selorson-v3-api.fly.dev/api/v1
      PUBLIC_APP_NAME: Selorson Admin
      PUBLIC_APP_VERSION: 3.0.0
      PUBLIC_WS_URL: wss://selorson-v3-api.fly.dev/ws
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require a dedicated Cloudflare project
        shell: bash
        run: |
          if [ -z "$ADMIN_PROJECT_NAME" ]; then
            echo "::error::Set CLOUDFLARE_ADMIN_PROJECT_NAME to a project distinct from the public web-user site."
            exit 1
          fi
          if [ "$ADMIN_PROJECT_NAME" = "selorson-frontend-v3" ]; then
            echo "::error::web-admin may not deploy over the public web-user project."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web-admin
        run: npm run build:web:admin

      - name: Upload immutable web-admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-admin-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          # Whole tree, for the same reason as the public deploy: _worker.js
          # imports ../output/server/index.js and ../cloudflare-tmp/manifest.js,
          # and wrangler bundles it on the deploy runner.
          path: .svelte-kit

  deploy:
    name: Deploy isolated web-admin artifact
    needs: build
    runs-on: ubuntu-latest
    environment: web-admin-production
    env:
      ADMIN_PROJECT_NAME: ${{ vars.CLOUDFLARE_ADMIN_PROJECT_NAME }}
    steps:
      # Same reason as the public deploy: wrangler bundles _worker.js here and
      # that bundle resolves bare specifiers from node_modules. --ignore-scripts
      # installs the dependencies without executing any project code on the
      # runner that holds the Cloudflare credentials.
      - name: Checkout dependency manifests
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without running project code
        run: npm ci --ignore-scripts

      - name: Download verified web-admin artifact
        uses: actions/download-artifact@v4
        with:
          name: web-admin-${{ github.run_id }}
          path: site

      - name: Require a dedicated Cloudflare project
        shell: bash
        run: |
          if [ -z "$ADMIN_PROJECT_NAME" ] || [ "$ADMIN_PROJECT_NAME" = "selorson-frontend-v3" ]; then
            echo "::error::web-admin requires its own Cloudflare Pages project."
            exit 1
          fi

      - name: Deploy to the dedicated Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/cloudflare --project-name=${{ vars.CLOUDFLARE_ADMIN_PROJECT_NAME }} --branch=main --commit-hash=${{ github.sha }}
