name: Deploy Frontend to Cloudflare Pages

on:
  workflow_run:
    workflows: ["Frontend CI Check"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare Pages
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create production environment
        run: |
          cat > .env.production << 'EOF'
          PUBLIC_API_BASE=https://selorson-v3-api.fly.dev/api/v1
          PUBLIC_APP_NAME="Selorson V3"
          PUBLIC_APP_VERSION=3.0.0
          PUBLIC_WS_URL=wss://selorson-v3-api.fly.dev/ws
          EOF

      - name: Build SvelteKit
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=selorson-frontend-v3

      - name: Verify public web routes
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 https://selorson-frontend-v3.pages.dev/ > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 https://selorson-frontend-v3.pages.dev/login > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 https://selorson-frontend-v3.pages.dev/profile/1 > /dev/null
