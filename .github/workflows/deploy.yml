name: Deploy Frontend to Cloudflare Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Frontend CI Check"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build web-user deployment artifact
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create production environment
        run: |
          cat > .env.production << 'EOF'
          PUBLIC_API_BASE=https://selorson-v3-api.fly.dev/api/v1
          PUBLIC_APP_NAME="Selorson V3"
          PUBLIC_APP_VERSION=3.0.0
          PUBLIC_WS_URL=wss://selorson-v3-api.fly.dev/ws
          EOF

      - name: Build the production web-user bundle
        run: npm run build:web:user
        env:
          NODE_ENV: production

      # The whole .svelte-kit tree travels, not just the cloudflare folder.
      # adapter-cloudflare writes a _worker.js that imports two siblings of that
      # folder — ../output/server/index.js and ../cloudflare-tmp/manifest.js —
      # and wrangler bundles the worker on the deploy runner. Shipping the
      # folder alone leaves those imports unresolvable and the deploy fails
      # after the files have already uploaded.
      - name: Upload immutable web-user artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-user-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          path: .svelte-kit

  deploy:
    name: Deploy web-user artifact to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    environment: web-user-production
    steps:
      - name: Download verified web-user artifact
        uses: actions/download-artifact@v4
        with:
          name: web-user-${{ github.run_id }}
          path: site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/cloudflare --project-name=selorson-frontend-v3 --branch=main --commit-hash=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify public web routes
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 https://selorson-frontend-v3.pages.dev/ > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 https://selorson-frontend-v3.pages.dev/about > /dev/null
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 https://selorson-frontend-v3.pages.dev/profile/1 > /dev/null
