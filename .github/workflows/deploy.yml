name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]

# Cancel in-progress deployments when a new push arrives
concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production environment
        run: |
          cat > .env.production << 'EOF'
          PUBLIC_API_BASE=https://selorson-v3-api.fly.dev/api/v1
          PUBLIC_APP_NAME="Selorson V3"
          PUBLIC_APP_VERSION=3.0.0
          PUBLIC_WS_URL=wss://selorson-v3-api.fly.dev/ws
          EOF

      - name: Build SvelteKit
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .svelte-kit/cloudflare --project-name=selorson-frontend-v3
