name: Flavor Boundary Check

on:
  pull_request:
    branches: [main, dev, qa]
  push:
    branches:
      - main
      - dev
      - qa
      - "feature/**"
      - "fix/**"
      - "cowriter/**"
      - "release/**"

concurrency:
  group: flavor-boundaries-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Kept separate from Frontend CI Check: the public web deploy waits only for
# its small web-user gate, while this workflow protects every distributable.
jobs:
  bundles:
    name: Build and inspect all platform × audience bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_API_BASE: http://localhost:8001/api/v1
      PUBLIC_APP_NAME: Selorson
      PUBLIC_APP_VERSION: 3.0.0
      PUBLIC_WS_URL: ws://localhost:8001/ws
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test flavor contracts
        run: npm run test:runtime

      # These must remain sequential because SvelteKit uses one output folder.
      - name: Build web-user
        run: npm run build:web:user

      - name: Build web-admin
        run: npm run build:web:admin

      - name: Build desktop-user webview
        run: npm run build:desktop:user

      - name: Build desktop-admin webview
        run: npm run build:desktop:admin

      - name: Build android-user webview
        run: npm run build:mobile:user

      - name: Build android-admin webview
        run: npm run build:mobile:admin
