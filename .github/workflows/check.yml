name: Frontend CI Check

on:
  pull_request:
    branches: [main, dev, qa]
  push:
    branches:
      - main
      - dev
      - qa
      - "feature/**"
      - "fix/**"
      - "cowriter/**"
      - "release/**"

concurrency:
  group: check-frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# This workflow is the public-web gate. Native desktop/Android checks are kept
# out of it so a Cloudflare deploy never waits for a 30-40 minute Tauri build.
jobs:
  web:
    name: 🌐 Web — check, build, leakage scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create dev environment
        run: |
          cat > .env << 'EOF'
          PUBLIC_API_BASE=http://localhost:8001/api/v1
          PUBLIC_APP_NAME="Selorson V3"
          PUBLIC_APP_VERSION=3.0.0
          PUBLIC_WS_URL=ws://localhost:8001/ws
          EOF

      - name: Sync SvelteKit
        run: npx svelte-kit sync

      - name: Run svelte-check
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Run runtime target regression tests
        run: npm run test:runtime

      - name: Build the public web-user bundle
        run: npm run build:web:user

      # Desktop-only code must never reach the public bundle.
      - name: Scan the bundle for desktop-only code
        run: |
          set -e
          for needle in playwright-core __nf_ctl runner_start_sidecar runner_run_job \
                        artifact-runner sidecar-runtime rate_limit_account detectAccountLimit; do
            if grep -rqF "$needle" .svelte-kit/output/client; then
              echo "::error::desktop-only symbol '$needle' reached the web bundle"
              exit 1
            fi
          done
          echo "clean: no desktop-only symbol in the client bundle"
