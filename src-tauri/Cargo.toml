[package]
name = "app"
version = "0.1.16"
description = "Selorson Desktop Shell"
authors = ["Selorson"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["admin-backend"]
admin-backend = [
    "dep:selorson-backend",
    "dep:tokio",
    "dep:dotenvy",
    "dep:rand",
    "dep:hex",
    "dep:reqwest",
]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11", features = [] }
tauri-plugin-log = "2.8"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.10"
tokio = { version = "1.0", features = ["full"], optional = true }
selorson-backend = { path = "../../backend-v3", optional = true }
dotenvy = { version = "0.15", optional = true }
rand = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }
reqwest = { version = "0.13.3", features = ["json"], optional = true }
